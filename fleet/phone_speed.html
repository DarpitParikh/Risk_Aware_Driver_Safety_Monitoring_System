<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Guardian GPS sender</title>
<body style="font:18px system-ui;max-width:560px;margin:30px auto;padding:16px">
<h1>Phone speed</h1><p>Keep this page open and the screen awake. Only speed, fix time and accuracy are sent; coordinates are not sent.</p>
<label>Pairing code <input id="token" type="password" autocomplete="off"></label>
<p><button id="start">Start GPS</button> <button id="stop">Stop</button></p>
<p id="status" role="status">Not connected</p>
<script>
const statusText=document.getElementById('status');
let watch=null, pending=false, generation=0, lastFix=0;
function stop(){generation++; if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;statusText.textContent='Stopped; PC marks GPS stale within 5 seconds';}
document.getElementById('stop').onclick=stop;
document.getElementById('start').onclick=()=>{
 stop(); const current=generation;
 if(!window.isSecureContext || !navigator.geolocation){statusText.textContent='GPS needs trusted HTTPS. Follow the PC setup guide.';return;}
 const token=document.getElementById('token').value.trim();
 if(!token){statusText.textContent='Enter the pairing code shown on the PC.';return;}
 statusText.textContent='Requesting GPS permission…';
 watch=navigator.geolocation.watchPosition(async position=>{
  if(pending || current!==generation)return;
  pending=true;lastFix=Date.now();
  try{
   const response=await fetch('/speed',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({timestamp:position.timestamp/1000,speed_mps:position.coords.speed,accuracy_m:position.coords.accuracy}),signal:AbortSignal.timeout(3000)});
   if(!response.ok)throw new Error(await response.text());
   if(current===generation)statusText.textContent=position.coords.speed===null?'GPS speed unavailable':`${(position.coords.speed*3.6).toFixed(1)} km/h sent · position accuracy ${position.coords.accuracy.toFixed(0)} m`;
  }catch(error){if(current===generation)statusText.textContent='Not sent: '+error.message;}
  finally{pending=false;}
 },error=>{if(current===generation)statusText.textContent='GPS unavailable: '+error.message;}, {enableHighAccuracy:true,maximumAge:0,timeout:5000});
};
setInterval(()=>{if(watch!==null && lastFix && Date.now()-lastFix>5000)statusText.textContent='No fresh GPS fix; PC assessment will be UNKNOWN';},1000);
</script></body></html>
